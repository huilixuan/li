<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>响应式WebApp商城</title>
  <!-- PWA配置 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e53935',
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .scroll-hide::-webkit-scrollbar {
        display: none;
      }
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app">
  <!-- 顶部导航栏 -->
  <header class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="flex items-center px-4 h-14">
      <h1 class="text-primary font-bold text-xl shrink-0">优选商城</h1>
      <div class="mx-3 flex-1">
        <div class="bg-gray-100 rounded-full px-4 py-2 flex items-center">
          <i class="fa fa-search text-gray-400 mr-2"></i>
          <input type="text" placeholder="搜索商品" class="bg-transparent outline-none w-full text-sm">
        </div>
      </div>
      <div class="shrink-0">
        <i class="fa fa-bell-o text-xl text-gray-600"></i>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="pb-20">
    <!-- 轮播Banner -->
    <div class="px-4 mt-3">
      <div class="rounded-xl overflow-hidden h-44 md:h-64 bg-gradient-to-r from-primary to-orange-400 flex items-center justify-center text-white text-2xl font-bold">
        活动大促专区
      </div>
    </div>

    <!-- 分类导航 -->
    <div class="mt-4 bg-white py-3">
      <div class="grid grid-cols-5 gap-2 px-2">
        <div class="flex flex-col items-center">
          <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-primary">
            <i class="fa fa-mobile"></i>
          </div>
          <span class="text-xs mt-1">手机</span>
        </div>
        <div class="flex flex-col items-center">
          <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-500">
            <i class="fa fa-laptop"></i>
          </div>
          <span class="text-xs mt-1">电脑</span>
        </div>
        <div class="flex flex-col items-center">
          <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-500">
            <i class="fa fa-headphones"></i>
          </div>
          <span class="text-xs mt-1">数码</span>
        </div>
        <div class="flex flex-col items-center">
          <div class="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center text-yellow-600">
            <i class="fa fa-clock-o"></i>
          </div>
          <span class="text-xs mt-1">配饰</span>
        </div>
        <div class="flex flex-col items-center">
          <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-purple-500">
            <i class="fa fa-ellipsis-h"></i>
          </div>
          <span class="text-xs mt-1">更多</span>
        </div>
      </div>
    </div>

    <!-- 商品列表：移动端2列，平板PC3~4列 -->
    <section class="mt-3 px-3">
      <h2 class="font-bold text-base py-2">🔥热门推荐</h2>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
        <!-- 商品卡片1 -->
        <div class="bg-white rounded-lg overflow-hidden shadow-sm">
          <div class="aspect-square bg-gray-200"></div>
          <div class="p-2">
            <h3 class="text-sm line-clamp-2">高性能无线蓝牙耳机长续航降噪</h3>
            <div class="mt-1">
              <span class="text-primary font-bold">¥199</span>
              <span class="text-xs text-gray-400 line-through ml-1">¥299</span>
            </div>
            <div class="text-xs text-gray-400 mt-1">已售2300+</div>
          </div>
        </div>
        <!-- 商品卡片2 -->
        <div class="bg-white rounded-lg overflow-hidden shadow-sm">
          <div class="aspect-square bg-gray-200"></div>
          <div class="p-2">
            <h3 class="text-sm line-clamp-2">轻薄便携快充移动电源大容量充电宝</h3>
            <div class="mt-1">
              <span class="text-primary font-bold">¥129</span>
              <span class="text-xs text-gray-400 line-through ml-1">¥169</span>
            </div>
            <div class="text-xs text-gray-400 mt-1">已售5600+</div>
          </div>
        </div>
        <!-- 商品卡片3 -->
        <div class="bg-white rounded-lg overflow-hidden shadow-sm">
          <div class="aspect-square bg-gray-200"></div>
          <div class="p-2">
            <h3 class="text-sm line-clamp-2">高清护眼智能平板学习娱乐两用</h3>
            <div class="mt-1">
              <span class="text-primary font-bold">¥1499</span>
              <span class="text-xs text-gray-400 line-through ml-1">¥1799</span>
            </div>
            <div class="text-xs text-gray-400 mt-1">已售890+</div>
          </div>
        </div>
        <!-- 商品卡片4 -->
        <div class="bg-white rounded-lg overflow-hidden shadow-sm">
          <div class="aspect-square bg-gray-200"></div>
          <div class="p-2">
            <h3 class="text-sm line-clamp-2">机械键盘青轴电竞办公全键热插拔</h3>
            <div class="mt-1">
              <span class="text-primary font-bold">¥249</span>
              <span class="text-xs text-gray-400 line-through ml-1">¥329</span>
            </div>
            <div class="text-xs text-gray-400 mt-1">已售1700+</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 底部Tab导航，适配手机安全区 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t safe-bottom">
    <div class="flex justify-around h-14 items-center">
      <div class="flex flex-col items-center text-primary">
        <i class="fa fa-home text-lg"></i>
        <span class="text-xs mt-1">首页</span>
      </div>
      <div class="flex flex-col items-center text-gray-500">
        <i class="fa fa-th-list text-lg"></i>
        <span class="text-xs mt-1">分类</span>
      </div>
      <div class="flex flex-col items-center text-gray-500 relative">
        <i class="fa fa-shopping-cart text-lg"></i>
        <span class="absolute -top-1 right-2 bg-primary text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">3</span>
        <span class="text-xs mt-1">购物车</span>
      </div>
      <div class="flex flex-col items-center text-gray-500">
        <i class="fa fa-user-o text-lg"></i>
        <span class="text-xs mt-1">我的</span>
      </div>
    </div>
  </nav>
</div>

<script>
// 简易路由切换逻辑，可扩展页面跳转
const tabs = document.querySelectorAll('nav > div > div');
tabs.forEach((tab, idx) => {
  tab.addEventListener('click', ()=>{
    tabs.forEach(t=>t.classList.remove('text-primary'));
    tabs.forEach(t=>t.classList.add('text-gray-500'));
    tab.classList.remove('text-gray-500');
    tab.classList.add('text-primary');
  })
})
</script>
</body>
</html>
